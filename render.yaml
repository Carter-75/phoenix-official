services:
  - type: web
    name: phoenix-fall-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCTION
        value: true
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.phoenix.fall
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
