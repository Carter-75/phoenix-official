name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Fixed debug signing (Fix Round 4): decode the project debug
      # keystore from the repo secret when it is set, so every CI
      # debug APK is signed with the same certificate and installs
      # over the previous test build on Carter's phone. Without the
      # secret the step is skipped and Gradle falls back to the
      # runner's throwaway debug key (the build stays green; the
      # APK then needs a fresh uninstall, which the fingerprint
      # verification below would flag by its absence).
      - name: Restore the fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/debug.keystore
          echo "DEBUG_KEYSTORE_RESTORED=true" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the web app
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: frontend/android
        run: bash gradlew assembleDebug --console=plain

      # Proof of the fixed signing: the built APK's signer
      # certificate SHA-256 must equal the project debug
      # keystore's fingerprint (recorded in
      # ~/workspace/phoenix-playtest/FIX-ROUND-4.md). Runs only
      # when the keystore was restored above; a mismatch fails
      # the build rather than shipping a wrongly signed APK.
      - name: Verify the debug APK signing fingerprint
        if: env.DEBUG_KEYSTORE_RESTORED == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          FP=$("$APKSIGNER" verify --print-certs frontend/android/app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Debug APK signer SHA-256: $FP"
          EXPECTED="c98d91187090f67de67752704f5aa39e37f2757a2aa74dabd455229be6da2a1d"
          if [ "$FP" != "$EXPECTED" ]; then
            echo "Fingerprint mismatch: expected $EXPECTED"
            exit 1
          fi
          echo "Fingerprint matches the fixed project debug keystore."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release bundle (unsigned until Play App Signing is set up)
        working-directory: frontend/android
        run: bash gradlew bundleRelease --console=plain

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
